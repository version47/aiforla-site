<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lafayette &#183; AI for LA</title>
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem('aiforla-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <span class="brandmark"><a href="index.html">AI <span class="for">for</span> LA</a></span>
    <nav class="topnav">
      <a href="index.html">Home</a>
      <a href="research.html">Research</a>
      <a href="index.html#cities" class="nav-cities">Find your city</a>
    </nav>
    <button class="tgl" id="themeBtn" aria-label="Toggle color theme">&#9680; theme</button>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>Lafayette</h1>
    <p class="sub">Lafayette Chapter coming soon</p>
  </div>
</section>

<section class="band">
  <div class="wrap">
    <div class="eyebrow">Other cities</div>
    <div class="citynav">
      <a href="baton-rouge.html">Baton Rouge</a>
      <a href="nola.html">NOLA</a>
      <a href="lake-charles.html">Lake Charles</a>
      <a href="alexandria.html">Alexandria</a>
      <a href="monroe.html">Monroe</a>

  </div>

<footer>
  <div class="wrap">
    <div class="brandmark">AI <span class="for">for</span> LA <span class="muted" style="font-weight:600">&#183; aiforla.org</span></div>
    <p>Built by Louisiana owners, for Louisiana owners</p>
  </div>
</footer>

<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('themeBtn');
  function sysDark(){return window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches}
  function cur(){return root.getAttribute('data-theme')||(sysDark()?'dark':'light')}
  btn.addEventListener('click',function(){
    var n=cur()==='dark'?'light':'dark';
    root.setAttribute('data-theme',n);
    try{localStorage.setItem('aiforla-theme',n)}catch(e){}
  });
})();
</script>
</body>
</html>
